        stable under concurrent inserts.
      parameters:
      - description: Page size (default 25, max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from a previous next_cursor
        in: query
        name: cursor
        type: string
      - description: Filter by status
        enum:
        - new
        - open
        - pending
        - solved
        - closed
        in: query
        name: status
        type: string
      - description: Filter by priority
        enum:
        - low
        - normal
        - high
        - urgent
        in: query
        name: priority
        type: string
      - description: Filter by assignee UUID
        in: query
        name: assignee_id
        type: string
      - description: Filter by requester UUID
        in: query
        name: requester_id
        type: string
