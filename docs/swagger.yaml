      description: Any member of the org may read a ticket. A ticket in another org
        returns 404, never 403.
      parameters:
      - description: Per-org ticket number (e.g. 1042)
        in: path
        name: number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Quoted version, use as If-Match on PATCH
              type: string
          schema:
            $ref: '#/definitions/tickets.TicketDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Fetch a ticket by its per-org number
      tags:
      - tickets
    patch:
      consumes:
      - application/json
      description: Any member of the org may update a ticket. Status changes are checked
        against the state machine (new -> open -> pending -> solved -> closed, with
        solved -> open as reopen; closed is terminal). A stale If-Match returns 412;
        a missing one returns 428. A ticket in another org returns 404, never 403.
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: integer
      - description: The ticket's current ETag. Missing -> 428, stale -> 412.
        in: header
        name: If-Match
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tickets.UpdateTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: New quoted version
              type: string
          schema:
            $ref: '#/definitions/tickets.TicketDTO'
        "400":
          description: Malformed If-Match, malformed JSON, or unknown field
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
        "412":
          description: If-Match version is stale
          schema:
            $ref: '#/definitions/httpx.APIError'
        "422":
          description: Invalid transition or invalid input
          schema:
            $ref: '#/definitions/httpx.APIError'
        "428":
          description: If-Match header is missing
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Update status, priority, or subject
      tags:
      - tickets
  /v1/tickets/{number}/assignment:
    post:
      consumes:
      - application/json
      description: 'Any member of the org may assign a ticket. Exactly one form: assignee_id
        (direct), team_id (set the team), or team_id plus auto:true (round-robin within
        the team). The assignee must be an org member with role owner, admin, or agent.
        A ticket in another org returns 404, never 403.'
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: integer
      - description: Assignment payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tickets.AssignTicketRequest'
      - description: Idempotency key for safe retries
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tickets.TicketDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Ticket or team not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
        "422":
          description: Invalid input, assignee not an agent, or team has no assignable
            members
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Assign a ticket to a user, a team, or round-robin
      tags:
      - tickets
  /v1/tickets/{number}/attachments/presign:
    post:
      consumes:
      - application/json
      description: Validates the declared filename, MIME type and size, creates a
        pending attachment and returns a presigned PUT URL valid for a few minutes.
        The client uploads directly to storage; the object key is server-generated
        and tenant-prefixed. Files over the configured limit and disallowed types
        are rejected before any URL is issued.
      parameters:
      - description: Ticket number
        in: path
        name: number
        required: true
        type: integer
      - description: Declared file metadata
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/attachments.PresignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/attachments.PresignResponse'
        "400":
          description: Malformed JSON
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Ticket not found in this org
          schema:
            $ref: '#/definitions/httpx.APIError'
        "422":
          description: Oversize file, disallowed type or invalid filename
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Presign an attachment upload
      tags:
      - attachments
  /v1/tickets/{number}/comments:
    get:
      description: Any member of the org may read comments. A ticket in another org
        returns 404, never 403. Internal notes are excluded unless include_internal=true.
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: integer
      - description: Include agent-only internal notes
        in: query
        name: include_internal
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/tickets.CommentDTO'
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: List comments on a ticket
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Any member of the org may add a public comment. Setting is_internal=true
        (an agent-only internal note) requires role owner, admin, or agent. A ticket
        in another org returns 404, never 403.
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: integer
      - description: Comment payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tickets.CreateCommentRequest'
      - description: Idempotency key for safe retries
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tickets.CommentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "403":
          description: Internal note without an agent role or above
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Add a comment to a ticket
      tags:
      - comments
  /v1/tickets/{number}/events:
    get:
      description: Any member of the org may read the timeline. Events are append-only
        and returned oldest-first. Each event has event_type and an opaque data object
        whose shape depends on the type. A ticket in another org returns 404, never
        403.
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: integer
      - description: Page size (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from a previous next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tickets.TicketEventListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: List the ticket timeline
      tags:
      - tickets
  /v1/tickets/{number}/macros/{id}:
    post:
      description: 'Any member of the org may apply a macro. Actions run in order:
        status, priority, tags, comment. Each action calls the same service method
        as the equivalent endpoint, so the state machine, events, and authorization
        apply. Application is not atomic: if a later action fails, earlier actions
        stay applied. Ordering status first means an illegal transition fails before
        anything is written.'
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: string
      - description: Macro UUID
        in: path
        name: id
        required: true
        type: string
      - description: Idempotency key for safe retries
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Macro or ticket not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
        "422":
          description: An action failed (e.g. illegal status transition, missing tag)
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Apply a macro to a ticket
      tags:
      - macros
  /v1/tickets/{number}/merge:
    post:
      consumes:
      - application/json
      description: 'Any member of the org may merge. The source ticket (in the path)
        is closed and marked merged_into_id; the target (into_number) survives. Rules:
        same org, different tickets, target not closed or already merged, same requester.
        System comments are added on both tickets. A merged ticket is read-only afterward.
        A ticket in another org returns 404, never 403.'
      parameters:
      - description: Source ticket number (the duplicate)
        in: path
        name: number
        required: true
        type: integer
      - description: Target ticket number
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tickets.MergeTicketRequest'
      - description: Idempotency key for safe retries
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/tickets.TicketDTO'
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Source or target not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
        "409":
          description: Target closed or already merged, or a merged ticket was modified
          schema:
            $ref: '#/definitions/httpx.APIError'
        "422":
          description: Merge into self, or different requesters
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Merge a ticket into another
      tags:
      - tickets
  /v1/tickets/{number}/tags/{tag}:
    delete:
      description: 'Any member of the org may detach a tag. Idempotent: a second detach
        of a tag that is not attached writes no event and returns 204.'
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: string
      - description: Tag name (lowercased)
        in: path
        name: tag
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Ticket or tag not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Detach a tag from a ticket
      tags:
      - tags
    put:
      description: 'Any member of the org may attach a tag. Idempotent: a second attach
        of the same tag writes no event and returns 204. The tag must already exist
        in the org; attach does not create it.'
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: string
      - description: Tag name (lowercased)
        in: path
        name: tag
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Ticket or tag not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Attach a tag to a ticket
      tags:
      - tags
  /v1/tickets/{number}/watchers/{userId}:
    delete:
      description: 'Any member of the org may remove a watcher. Idempotent: removing
        a user who is not a watcher is a no-op, 204.'
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: string
      - description: User UUID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Ticket not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Remove a watcher from a ticket
      tags:
      - watchers
    put:
      description: 'Any member of the org may add a watcher. The user must already
        be an org member; a user from another org returns 422. Idempotent: adding
        an existing watcher is a no-op, 204.'
      parameters:
      - description: Per-org ticket number
        in: path
        name: number
        required: true
        type: string
      - description: User UUID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Ticket not found, or belongs to another org
          schema:
            $ref: '#/definitions/httpx.APIError'
        "422":
          description: User is not a member of this org
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Add a watcher to a ticket
      tags:
      - watchers
  /v1/webhooks:
    get:
      description: Any authenticated member may list subscriptions. The HMAC secret
        is never returned by this endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.SubscriptionListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: List webhook subscriptions
      tags:
      - webhooks
    post:
      consumes:
      - application/json
      description: Requires role `owner` or `admin`. The URL must be an absolute http(s)
        URL whose host resolves only to public addresses; loopback, private, link-local
        and metadata addresses are rejected. The response contains the HMAC secret
        exactly once.
      parameters:
      - description: Subscription payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webhooks.CreateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/webhooks.SubscriptionDTO'
        "400":
          description: Malformed JSON or unknown field
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.APIError'
        "422":
          description: Invalid URL or events
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Create a webhook subscription
      tags:
      - webhooks
  /v1/webhooks/{id}:
    delete:
      description: Requires role `owner` or `admin`. Delivery-log rows for the subscription
        are removed with it.
      parameters:
      - description: Webhook UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Delete a webhook subscription
      tags:
      - webhooks
    get:
      description: Any authenticated member may read a subscription. A subscription
        in another org returns 404.
      parameters:
      - description: Webhook UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.SubscriptionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Get a webhook subscription
      tags:
      - webhooks
    patch:
      consumes:
      - application/json
      description: Requires role `owner` or `admin`. Omitted fields keep their value.
        Setting `is_active` to true re-enables a subscription disabled after repeated
        failures and resets its failure counter.
      parameters:
      - description: Webhook UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webhooks.UpdateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.SubscriptionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.APIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Update a webhook subscription
      tags:
      - webhooks
  /v1/webhooks/{id}/deliveries:
    get:
      description: Any authenticated member may read the delivery log. Results are
        newest first and keyset-paginated with `limit` (default 50, maximum 200) and
        `cursor`.
      parameters:
      - description: Webhook UUID
        in: path
        name: id
        required: true
        type: string
      - description: Page size (1-200)
        in: query
        name: limit
        type: integer
      - description: Opaque next_cursor from a previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.DeliveryListResponse'
        "400":
          description: Invalid id, limit or cursor
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: List webhook deliveries
      tags:
      - webhooks
  /v1/webhooks/{id}/deliveries/{deliveryId}/redeliver:
    post:
      description: Requires role `owner` or `admin`. Resets the delivery-log row and
        attempts it once immediately. Manual redelivery does not count toward the
        subscription circuit breaker and does not schedule an automatic retry.
      parameters:
      - description: Webhook UUID
        in: path
        name: id
        required: true
        type: string
      - description: Delivery UUID
        in: path
        name: deliveryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.DeliveryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Redeliver a webhook delivery
      tags:
      - webhooks
  /v1/webhooks/{id}/test:
    post:
      description: Requires role `owner` or `admin`. Sends one `webhook.ping` envelope
        immediately and records it in the delivery log. A failed receiver is reported
        in the delivery status rather than as an HTTP error. Disabled subscriptions
        return 409.
      parameters:
      - description: Webhook UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.DeliveryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.APIError'
        "409":
          description: Subscription is disabled
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - BearerAuth: []
      summary: Test a webhook subscription
      tags:
      - webhooks
schemes:
- http
securityDefinitions:
  BearerAuth:
