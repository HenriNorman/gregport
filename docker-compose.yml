name: gregport

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-gregport}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/0001_init_schema.up.sql:/docker-entrypoint-initdb.d/0001_init_schema.sql:ro
      - ./migrations/0002_init_schema.up.sql:/docker-entrypoint-initdb.d/0002_init_schema.sql:ro
      - ./migrations/0003_audit_logs.up.sql:/docker-entrypoint-initdb.d/0003_audit_logs.sql:ro
      - ./migrations/0004_worker_sla_email.up.sql:/docker-entrypoint-initdb.d/0004_worker_sla_email.sql:ro
      - ./migrations/0005_notifications_dedupe.up.sql:/docker-entrypoint-initdb.d/0005_notifications_dedupe.sql:ro
      - ./migrations/0006_ticket_ratings.up.sql:/docker-entrypoint-initdb.d/0006_ticket_ratings.sql:ro
      - ./migrations/0007_webhooks.up.sql:/docker-entrypoint-initdb.d/0007_webhooks.sql:ro
      - ./migrations/0008_inbound_email.up.sql:/docker-entrypoint-initdb.d/0008_inbound_email.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # Private S3-compatible object storage for attachments, thumbnails and
  # exports. Production can point the same S3 client at any compatible service.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # Creates the private bucket once MinIO is reachable, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-gregport-attachments}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      exit 0"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gregport-api:local
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-gregport}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      RATING_TOKEN_SECRET: ${RATING_TOKEN_SECRET:?set RATING_TOKEN_SECRET in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      APP_PORT: ${APP_PORT:-8080}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-gregport-attachments}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${APP_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: gregport-worker:local
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-gregport}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      RATING_TOKEN_SECRET: ${RATING_TOKEN_SECRET:?set RATING_TOKEN_SECRET in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      WORKER_PORT: ${WORKER_PORT:-8081}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-gregport-attachments}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    ports:
      - "${WORKER_PORT:-8081}:${WORKER_PORT:-8081}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${WORKER_PORT:-8081}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 40s
    restart: unless-stopped

  # Optional queue UI for operations. It is excluded from the default profile
  # because it is unauthenticated; start it with:
  #   docker compose --profile ops up -d asynqmon
  asynqmon:
    image: hibiken/asynqmon:0.7.2
    profiles: ["ops"]
    command:
      - "--redis-addr=redis:6379"
      - "--redis-db=${REDIS_DB:-0}"
      - "--redis-password=${REDIS_PASSWORD:-}"
      - "--port=8080"
      - "--read-only"
    ports:
      - "${ASYNQMON_PORT:-8082}:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
